<!DOCTYPE html>

  <title>Webcam con Cisnes abajo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #svg-container {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      padding: 10px;
      z-index: 1;
    }

    svg {
      width: 150px;
      height: 160px;
      pointer-events: none;
    }

    .color-part {
      transition: fill 0.5s ease;
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .wing {
      transform-origin: 130px 160px;
      animation: flap 1.5s ease-in-out infinite;
    }

    .wing.right {
      transform-origin: 210px 130px;
      animation: flap 1.5s ease-in-out infinite;
      animation-direction: alternate;
    }
  </style>
</head>

  <video id="video" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => video.srcObject = stream)
      .catch(() => alert("Debes permitir el acceso a la cámara."));

    // Función para color aleatorio en hex
    function getRandomColor() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    }

    // Cambiar colores de los polígonos cada segundo
    setInterval(() => {
      document.querySelectorAll('.color-part').forEach(poly => {
        poly.setAttribute('fill', getRandomColor());
      });
    }, 1000);
  </script>
